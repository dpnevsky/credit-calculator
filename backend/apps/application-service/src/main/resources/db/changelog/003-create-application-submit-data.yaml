databaseChangeLog:
  - changeSet:
      id: 003-create-application-submit-data
      author: dpnevsky
      changes:
        - createTable:
            tableName: application_submit_data
            columns:
              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: insurance_enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: salary_client
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: marital_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: dependent_amount
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: passport_issue_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: passport_issue_branch
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: employment_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: employer_inn
                  type: VARCHAR(32)
              - column:
                  name: salary
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: work_experience_total
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: work_experience_current
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: submitted_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: application_submit_data
            baseColumnNames: application_id
            constraintName: fk_application_submit_data_application
            referencedTableName: applications
            referencedColumnNames: id
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: application_submit_data