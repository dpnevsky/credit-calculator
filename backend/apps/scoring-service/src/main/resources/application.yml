spring:
  application:
    name: scoring-service

  datasource:
    url: jdbc:postgresql://localhost:5434/scoring_db
    username: scoring_user
    password: scoring_pass

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

management.endpoint.health:
  probes:
    enabled: true