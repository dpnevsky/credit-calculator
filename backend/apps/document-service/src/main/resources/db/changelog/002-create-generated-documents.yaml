databaseChangeLog:
  - changeSet:
      id: 002-create-generated-documents
      author: dpnevsky
      changes:
        - createTable:
            tableName: generated_documents
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: request_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: document_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: format
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: mime_type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: generated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: generated_documents