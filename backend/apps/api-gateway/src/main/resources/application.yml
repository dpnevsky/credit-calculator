spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: application-service
          uri: ${APPLICATION_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/applications/**
          filters:
            - AddRequestHeader=X-Forwarded-Prefix, /api

        - id: document-download
          uri: ${APPLICATION_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/documents/**
          filters:
            - AddRequestHeader=X-Forwarded-Prefix, /api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/credit-calculator}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/credit-calculator/protocol/openid-connect/certs}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

management.endpoint.health:
  probes:
    enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

auth:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:credit-calculator}
    client-id: ${KEYCLOAK_CLIENT_ID:credit-calculator-app}
    admin-username: ${AUTH_KEYCLOAK_ADMIN_USERNAME:${KEYCLOAK_ADMIN:admin}}
    admin-password: ${AUTH_KEYCLOAK_ADMIN_PASSWORD:${KEYCLOAK_ADMIN_PASSWORD:admin}}
